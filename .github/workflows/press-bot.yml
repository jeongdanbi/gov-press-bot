name: gov-press-bot

on:
  schedule:
    # 매시 17분 실행. 정각·30분은 GitHub 예약 실행이 몰려 밀리거나 건너뛰어서
    # */30 설정이 실제로는 평균 3시간 40분 간격이었다(2026-10-20 실측). 붐비지 않는 분으로 옮김.
    - cron: "17 * * * *"
  workflow_dispatch:   # 수동 실행 가능

# state/seen.json 커밋 권한
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: press-bot
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python -m src.main

      - name: Commit seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet state/seen.json; then
            echo "No changes to seen.json"
          else
            git add state/seen.json
            git commit -m "chore: update seen.json [skip ci]"
            git push
          fi
